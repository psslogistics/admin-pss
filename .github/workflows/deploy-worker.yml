name: Deploy Cloudflare Worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify provider weight reconciliation
        run: npm run test:provider-weight
      - name: Verify shipment billing reconciliation
        run: npm run test:billing
      - name: Verify wallet shipment identity
        run: npm run test:wallet-links
      - name: Verify Delhivery warehouse identity
        run: npm run test:warehouse
      - name: Verify Delhivery margin cost references
        run: npm run test:margin-sync
      - name: Apply production D1 migrations
        shell: bash
        run: |
          schema=$(npx wrangler d1 execute psslogisticsdatabase --remote --command "SELECT name FROM pragma_table_info('shipments') WHERE name = 'invoice_reference';" --config worker/wrangler.jsonc --json)
          if echo "$schema" | grep -q 'invoice_reference'; then
            echo "invoice_reference already exists; no D1 change needed."
          else
            npx wrangler d1 execute psslogisticsdatabase --remote --file worker/migrations/20261104_shipment_invoice_reference.sql --config worker/wrangler.jsonc
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 949019e415f3ecee95a018ded47449a7
      - name: Deploy pss-api
        run: npx wrangler deploy --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 949019e415f3ecee95a018ded47449a7
